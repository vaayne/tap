name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build full offline bundles
        run: scripts/build-full-bundles.sh "${GITHUB_REF_NAME#v}" dist dist/full
      - name: Upload full offline bundles
        run: gh release upload "$GITHUB_REF_NAME" dist/full/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
