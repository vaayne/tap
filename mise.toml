[tools]
go = "1.26"
goreleaser = "latest"
"github:golangci/golangci-lint" = "latest"
node = "latest"
pnpm = "latest"

[tasks.build]
description = "Build the tap binary"
run = "go build -o bin/tap ./cmd/tap"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks.run]
description = "Build and run tap"
depends = ["build"]
run = "./bin/tap {{arg(name='args', var=true)}}"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.release]
description = "Build a snapshot release with goreleaser"
run = "goreleaser release --snapshot --clean"

[tasks.tidy]
description = "Tidy go modules"
run = "go mod tidy"

[tasks.docs]
description = "Regenerate docs/cli.md from the CLI command tree"
run = "go run ./cmd/tap docs > docs/cli.md"

[tasks."web:build"]
description = "Build web UI"
run = "cd web && pnpm build"

[tasks."web:dev"]
description = "Start web UI dev server"
run = "cd web && pnpm dev"
